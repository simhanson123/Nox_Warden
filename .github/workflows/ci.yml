name: Core contracts and control plane
on: [push, pull_request]
permissions:
  contents: read
jobs:
  development:
    name: Core and isolated Linux smoke
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install checksum-pinned Rust
        run: FW_TOOLCHAIN_ROOT="$RUNNER_TEMP/rust" bash scripts/install-rust.sh
      - name: Activate Rust
        run: echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm ci --prefix web
      - run: bash scripts/check.sh
      - name: Real local HTTP and OpenAPI smoke
        run: |
          cargo build -p fw_control -p fw_cli --locked
          python scripts/smoke_control.py
          python scripts/smoke_cli.py
      - name: Isolated Linux packet regression
        run: python scripts/linux-lab.py --report reports/linux-lab.json
