name: Core contracts and control plane
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  canonical:
    name: Canonical Rust, web and contract checks
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install checksum-pinned Rust
        run: FW_TOOLCHAIN_ROOT="$RUNNER_TEMP/rust" bash scripts/install-rust.sh
      - name: Activate Rust
        run: echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm ci --prefix web
      - run: bash scripts/check.sh
  shared_authority:
    name: Authority suites with shared runner defaults
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-pinned Rust
        run: FW_TOOLCHAIN_ROOT="$RUNNER_TEMP/rust" bash scripts/install-rust.sh
      - name: Activate Rust
        run: echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Private authority storage with shared runner defaults
        run: |
          umask 0002
          cargo test --locked -p fw_authority -p fw_authority_service
  runtime:
    name: API, browser and isolated Linux suites
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install checksum-pinned Rust
        run: FW_TOOLCHAIN_ROOT="$RUNNER_TEMP/rust" bash scripts/install-rust.sh
      - name: Activate Rust
        run: echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm ci --prefix web
      - name: Build every runtime binary and example from the locked workspace
        run: cargo build --locked --workspace --bins --examples
      - name: Prepare both web applications for runtime checks
        run: |
          npm run build --prefix web
          npm run build:authority --prefix web
      - name: Real local HTTP and OpenAPI smoke
        run: |
          cargo build -p fw_control -p fw_cli -p fw_agent --locked
          python scripts/smoke_control.py
          python scripts/smoke_cli.py
      - name: Device enrollment and certificate revocation
        run: python scripts/smoke_enrollment.py
      - name: Independently pinned device metadata
        run: |
          cargo build --locked -p fw_authority --bin fw_authority_admin
          python scripts/smoke_enrollment.py --authority-metadata --report reports/target-metadata-smoke.json
      - name: Install pinned browser test tools
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Catalogue navigation and eligible choices
        run: python scripts/smoke_catalogue_navigation.py --controller-binary target/debug/fw_control
      - name: Browser passkey login and credential revocation
        run: python scripts/smoke_passkeys.py
      - name: Passkey login availability during anonymous requests
        run: python scripts/smoke_login_admission.py
      - name: Audit pagination and failed-login abuse resistance
        run: python scripts/smoke_audit.py
      - name: Independent policy review and signed decisions
        run: |
          cargo build -p fw_authority_service --bins --examples --locked
          python scripts/smoke_authority_review.py --service-binary target/debug/fw_authority_service --fixture-binary target/debug/examples/review_fixture
      - name: Isolated Linux packet regression
        run: python scripts/linux-lab.py --report reports/linux-lab.json
      - name: Signed Linux execution and crash recovery
        run: python scripts/signed-linux-lab.py --report reports/signed-linux-lab.json
      - name: Core access absolute lease and native expiry
        run: python scripts/core-access-linux-lab.py --skip-image-build --report reports/core-access-linux-lab.json
      - name: Retained compilation and actual native observation evidence
        run: python scripts/smoke_native_evidence.py --skip-image-build --report reports/native-evidence-smoke.json
      - name: Protected independent local signer and bootstrap authorization
        run: python scripts/smoke_protected_signer.py --skip-image-build --report reports/protected-signer-smoke.json
      - name: Retain smoke reports for seven days
        if: always()
        # actions/upload-artifact v7.0.2; Node 24, pinned to the release commit.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smoke-reports-${{ github.run_attempt }}
          path: |
            reports/http-smoke.json
            reports/cli-smoke.json
            reports/catalogue-browser.json
            reports/linux-lab.json
            reports/enrollment-smoke.json
            reports/target-metadata-smoke.json
            reports/signed-linux-lab.json
            reports/core-access-linux-lab.json
            reports/native-evidence-smoke.json
            reports/protected-signer-smoke.json
            reports/passkey-smoke.json
            reports/login-admission-smoke.json
            reports/authority-browser.json
            reports/audit-smoke.json
          retention-days: 7
          if-no-files-found: ignore
  target_bootstrap:
    name: Target bootstrap isolated Linux suite
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-pinned Rust
        run: FW_TOOLCHAIN_ROOT="$RUNNER_TEMP/rust" bash scripts/install-rust.sh
      - name: Activate Rust
        run: echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Fetch locked Rust dependencies for the offline lab build
        run: cargo fetch --locked
      - name: Target bootstrap journal, management paths and signed confirmation
        run: python scripts/target-bootstrap-linux-lab.py --report reports/target-bootstrap-linux-lab.json
      - name: Retain target bootstrap report for seven days
        if: always()
        # actions/upload-artifact v7.0.2; Node 24, pinned to the release commit.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: target-bootstrap-report-${{ github.run_attempt }}
          path: reports/target-bootstrap-linux-lab.json
          retention-days: 7
          if-no-files-found: ignore
  required_checks:
    name: Core and isolated Linux smoke
    needs: [canonical, shared_authority, runtime, target_bootstrap]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four complete suites to succeed
        env:
          CANONICAL_RESULT: ${{ needs.canonical.result }}
          SHARED_AUTHORITY_RESULT: ${{ needs.shared_authority.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          TARGET_BOOTSTRAP_RESULT: ${{ needs.target_bootstrap.result }}
        shell: bash
        run: |
          if [[ "$CANONICAL_RESULT" != success || "$SHARED_AUTHORITY_RESULT" != success || "$RUNTIME_RESULT" != success || "$TARGET_BOOTSTRAP_RESULT" != success ]]; then
            printf 'Required suites did not all succeed: canonical=%s shared_authority=%s runtime=%s target_bootstrap=%s\n' "$CANONICAL_RESULT" "$SHARED_AUTHORITY_RESULT" "$RUNTIME_RESULT" "$TARGET_BOOTSTRAP_RESULT" >&2
            exit 1
          fi
