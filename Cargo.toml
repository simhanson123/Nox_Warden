[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/webauthn-rs-0.5.4", "vendor/webauthn-rs-core-0.5.4"]

[patch.crates-io]
webauthn-rs = { path = "vendor/webauthn-rs-0.5.4" }
webauthn-rs-core = { path = "vendor/webauthn-rs-core-0.5.4" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
