[package]
name = "fw_authority"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "fw_authority_admin"
path = "src/bin/fw_authority_admin.rs"
required-features = ["approval-proofs"]

[features]
default = ["approval-proofs"]
approval-proofs = ["dep:fw_webauthn", "dep:fw_domain", "dep:fw_planner", "dep:fw_target_evidence", "dep:openssl", "dep:sha2", "rusqlite/backup", "rusqlite/hooks"]

[dependencies]
fw_target_evidence = { path = "../fw_target_evidence", optional = true }
fw_contracts = { path = "../fw_contracts" }
fw_webauthn = { path = "../fw_webauthn", optional = true }
fw_domain = { path = "../fw_domain", optional = true }
fw_planner = { path = "../fw_planner", optional = true }
sha2 = { workspace = true, optional = true }
openssl = { version = "=0.10.81", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
ed25519-dalek = "2.2.0"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
uuid = "1.18.1"
rusqlite = { workspace = true }

[dev-dependencies]
serde_cbor_2 = "=0.13.0"
tempfile = "3.23"
