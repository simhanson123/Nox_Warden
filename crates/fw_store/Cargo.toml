[package]
name = "fw_store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
fw_contracts = { path = "../fw_contracts" }
fw_domain = { path = "../fw_domain" }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
ipnet = "2.11"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.23"
